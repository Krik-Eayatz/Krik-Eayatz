
# List of plugins
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
 
# Display "window-<index>" directly in the status bar (e.g. window-1, window-2)
set -g @catppuccin_window_text " window-#I"
set -g @catppuccin_window_current_text " window-#I"
 
set -g @plugin 'tmux-plugins/tpm'
 
# Status bar on top
set -g status-position top
 
# Show weekday, date and time on the right side
# %a = weekday, %Y-%m-%d = date, %H:%M = time
set -g status-right "#[bold]%a %Y-%m-%d %H:%M"
 
# Stop tmux from renaming windows on its own (e.g. to the running command)
set -g allow-rename off
 
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
 
